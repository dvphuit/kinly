<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF7F2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Kinly" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kinly" />
    <meta name="description" content="Kinly - Theo dõi chăm sóc, tăng trưởng và nhật ký gia đình." />

    <title>Kinly | Theo dõi Bé & Mẹ</title>

    <!-- App typography (Self-hosted): Outfit for headings/display, Be Vietnam Pro for UI/body -->
    <link rel="preload" href="/fonts/be-vietnam-pro-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/outfit-semibold.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Outfit';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/outfit-regular.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Outfit';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('/fonts/outfit-semibold.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Outfit';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/outfit-bold.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Be Vietnam Pro';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/be-vietnam-pro-regular.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Be Vietnam Pro';
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/be-vietnam-pro-italic.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Be Vietnam Pro';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('/fonts/be-vietnam-pro-medium.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Be Vietnam Pro';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('/fonts/be-vietnam-pro-semibold.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Be Vietnam Pro';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/be-vietnam-pro-bold.woff2') format('woff2');
      }
      .haven-onboarding-container {
        min-height: 100vh;
        padding: 24px 16px 40px;
        background: #FAF8F5;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        box-sizing: border-box;
      }
      .haven-onboarding-card {
        width: 100%;
        max-width: 520px;
        background: #FFFFFF;
        border-radius: 28px;
        padding: 28px 22px;
        box-shadow: 0 16px 36px rgba(51, 37, 31, 0.08);
        border: 1px solid #ECE6DD;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
      }
      .haven-onboarding-header {
        text-align: center;
        margin-bottom: 24px;
      }
      .haven-onboarding-icon-wrap {
        width: 64px;
        height: 64px;
        border-radius: 22px;
        background: #E5ECD9;
        display: grid;
        place-items: center;
        margin: 0 auto 16px;
      }
      .haven-eyebrow {
        font-family: 'Outfit', -apple-system, sans-serif;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #587535;
        margin-bottom: 6px;
        display: block;
      }
      .haven-onboarding-header h2 {
        font-family: 'Outfit', -apple-system, sans-serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #39261D;
        margin: 0 0 8px;
      }
      .haven-onboarding-header p {
        font-family: 'Be Vietnam Pro', -apple-system, sans-serif;
        font-size: 13.5px;
        line-height: 1.55;
        color: #6E5A4E;
        margin: 0;
      }
    </style>

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
  </head>
  <body>
    <div id="root">
      <div class="haven-onboarding-container" id="onboardingScreen">
        <div class="haven-onboarding-card">
          <div class="haven-onboarding-step-view" id="stepGoogleAuth">
            <header class="haven-onboarding-header">
              <div class="haven-onboarding-icon-wrap auth-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#587535" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
              </div>
              <span class="haven-eyebrow">THIẾT LẬP LẦN ĐẦU · KINLY</span>
              <h2>Đăng nhập Google Drive</h2>
              <p>Lưu trữ và đồng bộ an toàn toàn bộ hồ sơ của Bé &amp; Mẹ trên Google Drive cá nhân của bạn.</p>
            </header>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
