name: Temporary Mediabunny lockfile update

on:
  push:
    branches:
      - feat/compress-media-before-drive-sync
    paths:
      - app/package.json
      - .github/workflows/temp-lock-mediabunny.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/compress-media-before-drive-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Update package lock
        working-directory: app
        run: npm install mediabunny@1.52.2 --save
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/package.json app/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Lock Mediabunny dependency"
          git push origin HEAD:feat/compress-media-before-drive-sync
