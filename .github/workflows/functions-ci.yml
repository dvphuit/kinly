name: Functions CI

on:
  pull_request:
    branches:
      - master

jobs:
  verify-functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install function dependencies
        run: npm install --no-audit --no-fund
      - name: Build functions
        run: npm run build
      - name: Test token encryption
        run: node --test test/tokenEncryption.test.mjs
