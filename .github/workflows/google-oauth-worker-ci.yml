name: Google OAuth Worker CI

on:
  pull_request:
    paths:
      - 'workers/google-oauth-broker/**'
      - '.github/workflows/google-oauth-worker-ci.yml'
  push:
    branches:
      - master
    paths:
      - 'workers/google-oauth-broker/**'
      - '.github/workflows/google-oauth-worker-ci.yml'

jobs:
  verify-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/google-oauth-broker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker tooling
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test OAuth broker
        run: npm test
      - name: Validate Worker bundle
        run: npm run check
