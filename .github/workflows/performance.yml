name: Performance CI

on:
  pull_request:
    branches:
      - master

jobs:
  performance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run performance regression tests
        run: npm test

      - name: Benchmark sync snapshot serialization
        run: npm run bench:sync

      - name: Check native animation source regressions
        working-directory: .
        run: |
          if grep -R -E "from ['\"]motion(/react)?['\"]|import\(['\"]motion(/react)?['\"]\)" app/src --include='*.tsx' --include='*.ts'; then
            echo "Motion runtime imports must not return"
            exit 1
          fi

          if grep -R "will-change" app/src --include='*.tsx' --include='*.ts' | grep -E "transform|opacity"; then
            echo "Avoid permanent will-change hints in React components"
            exit 1
          fi

          if grep -R "filter:\|backdrop-filter:" app/src --include='*.tsx' --include='*.ts' | grep -E "animate|transition"; then
            echo "Native animation code must not animate filter/backdrop-filter"
            exit 1
          fi

      - name: Build performance budget check
        run: npm run build
        env:
          VITE_PERFORMANCE_CHECK: true

      - name: Run Lighthouse CI audit
        run: npm run test:lighthouse

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: app/.lighthouseci/
          retention-days: 7
